<title>외계인 우주선 탈출 · 3학년 방탈출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#12141c;--panel:#1e2130;--panel2:#282c40;--ink:#f3efe4;--muted:#a9a6b8;--gold:#9c7bd1;--red:#e85d5d;--green:#5fd39a;--line:#3a3f57}
*{box-sizing:border-box}

.brand{font-family:'Black Han Sans',sans-serif;font-size:20px;color:var(--gold)}
.brand a{color:var(--muted);text-decoration:none;font-family:'Gowun Dodum';font-size:15px;margin-right:8px;border:1px solid var(--line);border-radius:999px;padding:2px 10px}

.pill{background:var(--panel);border:1px solid var(--line);padding:4px 12px;border-radius:999px}

h2{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:23px;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}
.story{background:var(--panel2);border-left:4px solid var(--gold);padding:14px 16px;border-radius:10px;margin:14px 0;text-align:left;line-height:1.75}
.center{text-align:center}.muted{color:var(--muted);font-size:15px}
button{font-family:inherit;font-size:18px;border:0;border-radius:12px;padding:10px 18px;cursor:pointer;font-weight:bold}
.btn{background:var(--gold);color:#1d1600}.btn:disabled{opacity:.4}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.roombar{display:flex;justify-content:space-between;align-items:center;margin:6px 0 8px;gap:8px;flex-wrap:wrap}

.hot .ah{fill:#fff;fill-opacity:0;stroke:#fff;stroke-opacity:0;stroke-width:5;transition:fill-opacity .15s,stroke-opacity .15s}.hot:hover .ah{fill-opacity:.14;stroke-opacity:.95}.hot.selhint .ah{stroke:#ffd54f;stroke-opacity:1;fill-opacity:.12}.hot.done .ah{fill-opacity:0}.hot{cursor:pointer;transition:filter .15s}
.hot:hover{filter:drop-shadow(0 0 12px color-mix(in srgb,var(--gold) 90%,transparent)) brightness(1.08)}
.hot.done{filter:saturate(.75)}
.hot.selhint{animation:hl 1.2s ease-in-out infinite}

.ov.hide{display:none}

.mx{position:absolute;right:12px;top:10px;background:transparent;color:var(--muted);font-size:24px;padding:4px 10px}
.box{background:var(--panel2);border-radius:12px;padding:14px;margin:10px 0;line-height:1.75}
.paper{background:#f4ecd8;color:#3a2c1a;border-radius:6px;padding:16px 18px;margin:10px 0;box-shadow:inset 0 0 30px rgba(120,90,40,.25);font-size:18px;line-height:1.8}
.paper b{color:#7a2e12}
.shake{animation:shake .45s}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.msg{text-align:center;min-height:28px;margin-top:8px;font-weight:bold}.msg.good{color:var(--green)}.msg.bad{color:var(--red)}
.lockform{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}

.seqshow{display:flex;gap:6px;justify-content:center;min-height:52px;margin:10px 0;flex-wrap:wrap}
.seqshow span{min-width:46px;height:46px;border-radius:10px;background:var(--panel2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px}
.pad{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pad button{min-width:64px;min-height:56px;background:var(--panel2);color:var(--ink);font-size:24px;border:2px solid var(--line)}
.pad button.c{width:60px;height:60px;border-radius:50%;border:3px solid #fff3}
.keys{display:flex;justify-content:center;gap:3px;margin:10px 0}
.keys button{width:52px;height:150px;background:linear-gradient(#fff,#e8e8e8);color:#333;border-radius:0 0 10px 10px;font-size:15px;padding:0 0 10px;display:flex;align-items:flex-end;justify-content:center;box-shadow:0 4px 0 #999}

.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px}
.opt{background:var(--panel2);color:var(--ink);border:2px solid var(--line);min-width:110px;padding:12px 16px;font-size:18px}
.opt.big{font-size:34px;min-width:80px}

.toast.on{opacity:1}

function fresh(){return{v:SAVE_V,room:-1,flags:{},inv:[],used:{},hints:[0,0,0,0],start:0,end:0,wrong:0}}
let S;try{if(QS.get('reset')==='1')localStorage.removeItem(SKEY);S=JSON.parse(localStorage.getItem(SKEY));if(!S||S.v!==SAVE_V)S=fresh()}catch(e){S=fresh()}
const save=()=>{try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}};
let SEL=null;
const has=id=>S.inv.includes(id);
const flag=f=>!!S.flags[f];
function give(id){if(!has(id)){S.inv.push(id);toast(`${TH.items[id].e} <b>${TH.items[id].n}</b>을(를) 얻었다!`.replace('을(를)',josa(TH.items[id].n)));tone(880);setTimeout(()=>tone(1320),120)}save();renderInv()}
/*ENGINE3*/function tryCombo(a,b){const c=(TH.combos||[]).find(x=>(x[0]===a&&x[1]===b)||(x[0]===b&&x[1]===a));if(!c)return false;consume(a);consume(b);SEL=null;tone(520);setTimeout(()=>tone(780),110);give(c[2]);if(c[3])setTimeout(()=>toast(val(c[3])),1300);render();return true}
function lookItem(id){const it=TH.items[id];if(it&&it.look){openModal(it.e+' '+it.n,val(it.look));return true}return false}
function consume(id){S.inv=S.inv.filter(x=>x!==id);if(SEL===id)SEL=null;save();renderInv()}
function josa(w){const c=w.charCodeAt(w.length-1)-0xAC00;return(c>=0&&c<11172&&c%28)?'을':'를'}
function toast(t){const e=$('toast');e.innerHTML=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2400)}
let actx=null;function tone(f,d){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.25,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+(d||.5));o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+(d||.5))}catch(e){}}

window.__auto=async function(){const out=[];const sl=ms=>new Promise(r=>setTimeout(r,ms));
  const closeIf=()=>{if(!$('ov').classList.contains('hide'))closeModal()};
  const step=async()=>{const r=rooms()[S.room];const dk=r.dark&&!flag(r.dark);
    for(const c of (TH.combos||[]))if(has(c[0])&&has(c[1])){tryCombo(c[0],c[1]);closeIf();out.push('combo:'+c[2]);return true}
    for(const g in (TH.seqs||{})){const sd=TH.seqs[g];if(flag(sd.set))continue;const ps=r.objects.filter(o=>o.press&&o.press[0]===g&&avail(o)&&!(dk&&!o.glow));if(!sd.ans.every(v=>ps.some(o=>o.press[1]===v)))continue;if(ps.some(o=>o.need&&!S.used['u_'+o.id]&&!has(o.need)))continue;for(const v of sd.ans){const o=ps.find(x=>x.press[1]===v);if(o.need&&!S.used['u_'+o.id])SEL=o.need;activate(o);closeIf()}out.push('seq:'+g);return true}
    for(const o of r.objects){if(!avail(o))continue;if(dk&&!o.glow&&!o.door)continue;if(o.press)continue;
      if(o.toggle){if(flag(o.toggle))continue;if(o.need&&!has(o.need)&&!S.used['u_'+o.id])continue;if(o.need&&!S.used['u_'+o.id])SEL=o.need;activate(o);closeIf();out.push(o.id);return true}
      if(o.slots&&!S.used['u_'+o.id]){if(o.door&&o.when&&!o.when.every(flag))continue;const pl=S.used['sl_'+o.id]||[];const it=o.slots.find(x=>has(x)&&!pl.includes(x));if(!it)continue;SEL=it;const room=S.room;activate(o);await sl(5);if(o.lock&&S.used['u_'+o.id]&&!solved(o)){await solveLock(o)}if(S.room===room)closeIf();out.push(o.id+'<'+it);return true}
      if(solved(o))continue;if(o.door&&o.when&&!o.when.every(flag))continue;if(o.need&&!has(o.need)&&!S.used['u_'+o.id])continue;if(o.door&&!o.lock&&!(o.needs||[]).every(flag))continue;
      const room=S.room;if(o.need&&!S.used['u_'+o.id])SEL=o.need;activate(o);await sl(5);
      if(o.lock&&!solved(o))await solveLock(o);
      if(S.room===room)closeIf();out.push(o.id);return true}
    return false};
  const solveLock=async o=>{const k=val(o.lock);const v=k.ans;if(!$('lkOk')&&!document.querySelector('#mbody [data-v],#mbody .opt,#li'))return;
    if(['dial','multi','match','sort','slide','grid','rotate'].includes(k.kind)){$('mbody')._set(v);$('lkOk').click()}else if(k.kind==='text'){$('li').value=v;$('lf').requestSubmit()}
    else if(k.kind==='choice'){[...document.querySelectorAll('#mbody .opt')].find(b=>b.dataset.v===k.ans).click()}
    else{const arr=Array.isArray(v)?v:String(v).split('');for(const x of arr)[...document.querySelectorAll('#mbody [data-v]')].find(b=>b.dataset.v===x).click();$('lkOk')&&$('lkOk').click()}
    await sl(30)};
  for(let guard=0;guard<600&&S.room<rooms().length;guard++){if(await step())continue;
    const cur=S.room;let ok=false;for(let i=0;i<=Math.min(S.max||0,rooms().length-1);i++){if(i===cur)continue;goRoom(i);if(await step()){ok=true;break}}
    if(!ok){goRoom(cur);return{stuck:cur,inv:S.inv,flags:S.flags,done:out}}
    if(S.room<rooms().length&&S.room!==cur&&S.room<(S.max||0))goRoom(S.max)}
  return{ok:S.room>=rooms().length,done:out}};
</script>

const AMbox=a=>{const ns='http://www.w3.org/2000/svg';const sv=document.createElementNS(ns,'svg');sv.setAttribute('width','1600');sv.setAttribute('height','900');sv.style.cssText='position:absolute;left:-9999px;top:0';sv.innerHTML=DEFS+a;document.body.appendChild(sv);let b={x:0,y:0,width:1,height:1};try{const g=document.createElementNS(ns,'g');while(sv.childNodes.length>1)g.appendChild(sv.childNodes[1]);sv.appendChild(g);const r=g.getBBox();b={x:r.x,y:r.y,width:r.width||1,height:r.height||1}}catch(e){}sv.remove();return b};
ARTMAP.rooms.forEach((hot,ri)=>{const r=THEME.rooms[ri];if(!r||!hot)return;const src='art/'+ARTMAP.id+'_'+(ri+1)+'.webp';
 r.bg=()=>`<image href="${src}" x="0" y="0" width="1600" height="900" preserveAspectRatio="xMidYMid slice"/>`;
 r.objects=r.objects.filter(o=>!(o.deco&&!hot[o.id]));
 r.objects.forEach(o=>{const h=hot[o.id];if(!h)return;const [x,y,w,hh,opt]=h;const old=o.art;
  o.art=()=>{let s='';if(opt&&opt.keep){const [tx,ty,sc]=opt.keep;s=`<g transform="translate(${tx} ${ty}) scale(${sc})">${val(old)}</g>`}
   if(opt&&opt.clip){const [ox,oy,orr,nx,ny,nr]=opt.clip;const sc=nr/orr;const cid='cl_'+o.id;s+=`<clipPath id="${cid}"><circle cx="${ox}" cy="${oy}" r="${orr}"/></clipPath><g transform="translate(${nx-ox*sc} ${ny-oy*sc}) scale(${sc})"><g clip-path="url(#${cid})">${val(old)}</g></g>`}
   if(opt&&opt.lab){const arr=eval(opt.lab.expr);s+=arr.map((t,i)=>{const [lx,ly]=opt.lab.pos?opt.lab.pos[i]:[x+w*(i+.5)/arr.length,opt.lab.y];return `<rect x="${lx-48}" y="${ly-30}" width="96" height="56" rx="14" fill="#3e2723" stroke="#ffe082" stroke-width="4" opacity=".92"/><text x="${lx}" y="${ly+10}" text-anchor="middle" font-size="32" font-weight="bold" fill="#ffe082">${t}</text>`}).join('')}
   if(opt&&opt.svg){s+=eval(opt.svg)}
   if(opt&&opt.fit){const a=val(old);const b=AMbox(a);const p=opt.pad??0.9;const sc=Math.min(w/b.width,hh/b.height)*p;const tx=x+w/2-(b.x+b.width/2)*sc,ty=y+hh/2-(b.y+b.height/2)*sc;s=`<g transform="translate(${tx} ${ty}) scale(${sc})" opacity="${opt.op??1}">${a}</g>`}
   return s+`<rect class="ah" x="${x}" y="${y}" width="${w}" height="${hh}" rx="22"/>`}})});
