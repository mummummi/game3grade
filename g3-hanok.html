<!DOCTYPE html>
<html lang="ko">
<head>
<script>(function(){var P='g3-',S=Storage.prototype,G=S.getItem,T=S.setItem,R=S.removeItem;S.getItem=function(k){return G.call(this,P+k)};S.setItem=function(k,v){return T.call(this,P+k,v)};S.removeItem=function(k){return R.call(this,P+k)}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>조선 한옥의 비밀 · 3학년 방탈출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#12141c;--panel:#1e2130;--panel2:#282c40;--ink:#f3efe4;--muted:#a9a6b8;--gold:#e0a35a;--red:#e85d5d;--green:#5fd39a;--line:#3a3f57}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0%,color-mix(in srgb,var(--gold) 14%,#232842) 0%,var(--bg) 60%);color:var(--ink);font-family:'Gowun Dodum',system-ui,sans-serif;min-height:100vh;font-size:18px;line-height:1.6;-webkit-user-select:none;user-select:none}
.wrap{max-width:1000px;margin:0 auto;padding:14px 12px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.brand{font-family:'Black Han Sans',sans-serif;font-size:20px;color:var(--gold)}
.brand a{color:var(--muted);text-decoration:none;font-family:'Gowun Dodum';font-size:15px;margin-right:8px;border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.stats{display:flex;gap:8px;font-size:15px;flex-wrap:wrap}
.pill{background:var(--panel);border:1px solid var(--line);padding:4px 12px;border-radius:999px}
.pill.lv{background:color-mix(in srgb,var(--gold) 25%,var(--panel));border-color:var(--gold)}
h1{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:38px;margin:0 0 6px;color:var(--gold);text-shadow:0 0 24px color-mix(in srgb,var(--gold) 45%,transparent)}
h2{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:23px;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}
.story{background:var(--panel2);border-left:4px solid var(--gold);padding:14px 16px;border-radius:10px;margin:14px 0;text-align:left;line-height:1.75}
.center{text-align:center}.muted{color:var(--muted);font-size:15px}
button{font-family:inherit;font-size:18px;border:0;border-radius:12px;padding:10px 18px;cursor:pointer;font-weight:bold}
.btn{background:var(--gold);color:#1d1600}.btn:disabled{opacity:.4}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.roombar{display:flex;justify-content:space-between;align-items:center;margin:6px 0 8px;gap:8px;flex-wrap:wrap}
.scene{position:relative;width:100%;border-radius:16px;overflow:hidden;border:2px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.45);background:#000}
.scene svg{display:block;width:100%;height:auto}
.hot{cursor:pointer;transition:filter .15s}
.hot:hover{filter:drop-shadow(0 0 12px color-mix(in srgb,var(--gold) 90%,transparent)) brightness(1.08)}
.hot.done{filter:saturate(.75)}
.hot.selhint{animation:hl 1.2s ease-in-out infinite}
@keyframes hl{50%{filter:drop-shadow(0 0 14px #fff) brightness(1.2)}}
.inv{display:flex;gap:8px;align-items:center;margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;min-height:62px;flex-wrap:wrap}
.inv .lbl{color:var(--muted);font-size:14px;margin-right:4px}
.item{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:4px 10px;display:flex;align-items:center;gap:6px;cursor:pointer;font-size:15px}
.item b{font-size:26px;font-weight:400}.item.sel{border-color:var(--gold);box-shadow:0 0 12px color-mix(in srgb,var(--gold) 60%,transparent);transform:translateY(-2px)}
.ov{position:fixed;inset:0;background:rgba(5,6,12,.78);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.ov.hide{display:none}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:min(720px,100%);max-height:92vh;overflow:auto;padding:20px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mcard h3{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:24px;margin:0 36px 10px 0;color:var(--gold)}
.mx{position:absolute;right:12px;top:10px;background:transparent;color:var(--muted);font-size:24px;padding:4px 10px}
.box{background:var(--panel2);border-radius:12px;padding:14px;margin:10px 0;line-height:1.75}
.paper{background:#f4ecd8;color:#3a2c1a;border-radius:6px;padding:16px 18px;margin:10px 0;box-shadow:inset 0 0 30px rgba(120,90,40,.25);font-size:18px;line-height:1.8}
.paper b{color:#7a2e12}
.shake{animation:shake .45s}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.msg{text-align:center;min-height:28px;margin-top:8px;font-weight:bold}.msg.good{color:var(--green)}.msg.bad{color:var(--red)}
.lockform{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.lockform input{font-family:inherit;font-size:24px;text-align:center;width:min(260px,70vw);padding:8px;border-radius:12px;border:2px solid var(--line);background:#0e1018;color:var(--ink);letter-spacing:3px}
.dials{display:flex;gap:10px;justify-content:center;margin:12px 0}
.dial{display:flex;flex-direction:column;align-items:center;gap:4px}
.dial button{background:var(--panel2);color:var(--ink);padding:2px 14px;font-size:16px}
.dial .d{width:58px;height:70px;border-radius:12px;background:linear-gradient(#0b0d14,#23283b,#0b0d14);border:2px solid color-mix(in srgb,var(--gold) 60%,var(--line));display:flex;align-items:center;justify-content:center;font-family:'Black Han Sans';font-size:38px;color:var(--gold);box-shadow:inset 0 6px 10px #000a}
.seqshow{display:flex;gap:6px;justify-content:center;min-height:52px;margin:10px 0;flex-wrap:wrap}
.seqshow span{min-width:46px;height:46px;border-radius:10px;background:var(--panel2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px}
.pad{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pad button{min-width:64px;min-height:56px;background:var(--panel2);color:var(--ink);font-size:24px;border:2px solid var(--line)}
.pad button.c{width:60px;height:60px;border-radius:50%;border:3px solid #fff3}
.keys{display:flex;justify-content:center;gap:3px;margin:10px 0}
.keys button{width:52px;height:150px;background:linear-gradient(#fff,#e8e8e8);color:#333;border-radius:0 0 10px 10px;font-size:15px;padding:0 0 10px;display:flex;align-items:flex-end;justify-content:center;box-shadow:0 4px 0 #999}
.keys button:active{transform:translateY(3px);background:#ffe9a8}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px}
.opt{background:var(--panel2);color:var(--ink);border:2px solid var(--line);min-width:110px;padding:12px 16px;font-size:18px}
.opt.big{font-size:34px;min-width:80px}
.ordercards{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
.ordercards button{background:var(--panel2);color:var(--ink);border:2px solid var(--line);padding:10px 14px;font-size:17px;min-width:90px;position:relative}
.ordercards button.on{border-color:var(--gold);opacity:.55}
.ordercards button i{position:absolute;top:-10px;left:-8px;background:var(--gold);color:#000;font-style:normal;border-radius:50%;width:24px;height:24px;font-size:14px;line-height:24px}
.hint{background:var(--panel2);border-radius:10px;padding:10px 14px;margin:8px 0;text-align:left}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#000d;color:#fff;border:1px solid var(--gold);padding:10px 18px;border-radius:999px;z-index:80;font-size:16px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
table.t{border-collapse:collapse;margin:8px auto;background:#0e1018}table.t td,table.t th{border:1px solid var(--line);padding:6px 10px;text-align:center}table.t th{background:var(--panel2);color:var(--gold)}
.vis{display:flex;justify-content:center;margin:8px 0}.vis svg{max-width:100%;height:auto}
.big{font-size:56px;line-height:1.2}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}
.steps div{background:var(--panel2);border-radius:12px;padding:10px;font-size:15px}.steps b{display:block;font-size:26px}
.speak{background:var(--panel2);color:var(--ink);padding:4px 10px;font-size:16px;margin-left:6px}
body.kids{font-size:20px}body.kids .box,body.kids .paper{font-size:20px}
@media (max-width:600px){h1{font-size:30px}.keys button{width:38px;height:120px}.dial .d{width:48px;height:60px;font-size:32px}}
</style>
</head>

<script>
window.addEventListener('error',function(){try{if(document.getElementById('crash'))return;var d=document.createElement('div');d.id='crash';d.style.cssText='position:fixed;inset:0;z-index:99;background:#05060cdd;display:flex;align-items:center;justify-content:center;padding:16px';d.innerHTML='<div style="background:#1e2130;color:#f3efe4;border-radius:20px;padding:24px;max-width:440px;text-align:center"><div style="font-size:54px">🛠️</div><h2>앗, 게임이 멈췄어요</h2><p>게임이 새로 바뀌어서 예전 기록과 맞지 않을 수 있어요.</p><button id="crashBtn" style="background:#f2c14e;border:0;border-radius:12px;padding:10px 20px;font-size:18px;font-weight:bold">처음부터 다시 시작</button></div>';document.body.appendChild(d);document.getElementById('crashBtn').onclick=function(){try{localStorage.removeItem(window.SKEY_FOR_RESET)}catch(e){}location.reload()}}catch(e){}});
</script>
<script>
'use strict';
const GRADE=3,GAME='g3-hanok',KEY='esc2-g3-hanok-v1';
const $=id=>document.getElementById(id);
const LVN={easy:'🟢 쉬움',normal:'🟡 보통',hard:'🔴 어려움'};
const QS=new URLSearchParams(location.search);
let LV=QS.get('lv');if(!LVN[LV]){try{LV=localStorage.getItem('class-level')}catch(e){}}if(!LVN[LV])LV='normal';
const L=(e,n,h)=>LV==='easy'?e:LV==='hard'?(h===undefined?n:h):n;   // 단계별 값 고르기
const SKEY=LV==='normal'?KEY:KEY+'-'+LV;window.SKEY_FOR_RESET=SKEY;
const SAVE_V=3;
/* ═══════ 그림 도우미 (SVG 1600×900) ═══════ */
const R=(x,y,w,h,f,ex='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" ${ex}/>`;
const C=(x,y,r,f,ex='')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" ${ex}/>`;
const E=(x,y,rx,ry,f,ex='')=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}" ${ex}/>`;
const P=(d,f,ex='')=>`<path d="${d}" fill="${f}" ${ex}/>`;
const T=(x,y,t,c='#fff',s=24,w='normal',ex='')=>`<text x="${x}" y="${y}" fill="${c}" font-size="${s}" font-weight="${w}" text-anchor="middle" font-family="Gowun Dodum, sans-serif" ${ex}>${t}</text>`;
const EM=(x,y,e,s=60,ex='')=>`<text x="${x}" y="${y}" font-size="${s}" text-anchor="middle" dominant-baseline="central" ${ex}>${e}</text>`;
const G=(inner,ex='')=>`<g ${ex}>${inner}</g>`;
const hot=(id,inner)=>`<g class="hot" data-id="${id}">${inner}</g>`;
const DEFS=`<defs><radialGradient id="vign" cx="50%" cy="45%" r="75%"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".55"/></radialGradient>
<radialGradient id="glowY" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fff6c8" stop-opacity=".85"/><stop offset="100%" stop-color="#fff6c8" stop-opacity="0"/></radialGradient>
<linearGradient id="wood" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#8d5a34"/><stop offset="1" stop-color="#5e3a1f"/></linearGradient>
<linearGradient id="metal" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#b8c1cc"/><stop offset=".5" stop-color="#7d8794"/><stop offset="1" stop-color="#5a636e"/></linearGradient>
<linearGradient id="glass" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#e3f4ff" stop-opacity=".55"/><stop offset="1" stop-color="#9fc7e6" stop-opacity=".25"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".45"/></filter></defs>`;
const svgWrap=s=>`<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">${DEFS}${s}${R(0,0,1600,900,'url(#vign)','pointer-events="none"')}</svg>`;
/* 배경 */
const ART={
  wall(c1,c2,pat){let s=`<linearGradient id="wg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`+R(0,0,1600,660,'url(#wg)');
    if(pat==='brick'){for(let y=0;y<660;y+=44)for(let x=(y/44%2)*55-55;x<1600;x+=110)s+=R(x+2,y+2,106,40,'none','stroke="#0002" stroke-width="3" rx="3"')}
    if(pat==='stripe'){for(let x=0;x<1600;x+=80)s+=R(x,0,40,660,'#ffffff0d')}
    if(pat==='panel'){for(let x=40;x<1600;x+=260)s+=R(x,300,220,300,'none','stroke="#0002" stroke-width="5" rx="6"')+R(x,40,220,220,'none','stroke="#0002" stroke-width="5" rx="6"')}
    if(pat==='stone'){for(let y=0;y<660;y+=70)for(let x=(y/70%2)*80-80;x<1600;x+=160)s+=R(x+3,y+3,154,64,'#ffffff08','stroke="#0003" stroke-width="4" rx="12"')}
    if(pat==='metal'){for(let x=0;x<1600;x+=200)s+=R(x,0,4,660,'#0003');for(let y=110;y<660;y+=220)s+=R(0,y,1600,4,'#0003');for(let x=20;x<1600;x+=200)for(let y=20;y<660;y+=220)s+=C(x,y,5,'#0004')+C(x+160,y,5,'#0004')}
    if(pat==='wood'){for(let x=0;x<1600;x+=64)s+=R(x,0,62,660,'none','stroke="#0002" stroke-width="2"')}
    if(pat==='hanji'){for(let x=0;x<1600;x+=100)s+=R(x,0,3,660,'#0002');for(let y=0;y<660;y+=100)s+=R(0,y,1600,3,'#0002')}
    return s},
  floor(c1,c2,pat){let s=`<linearGradient id="fg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`+R(0,650,1600,250,'url(#fg)')+R(0,644,1600,14,'#0005');
    if(pat==='wood')for(let y=670;y<900;y+=36)s+=R(0,y,1600,2,'#0002');
    if(pat==='tile')for(let x=-200;x<1800;x+=120)s+=`<line x1="${800+(x-800)*.55}" y1="650" x2="${x}" y2="900" stroke="#0002" stroke-width="3"/>`;
    if(pat==='tile')for(let y=690;y<900;y+=50)s+=R(0,y,1600,3,'#0002');
    return s},
  sky(c1,c2){return `<linearGradient id="sk" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`+R(0,0,1600,900,'url(#sk)')},
  skyR(x,y,w,h,c1,c2){const id='sg'+x+'_'+y;return `<linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`+R(x,y,w,h,`url(#${id})`)},
  starsIn(x,y,w,h,n){let s='';for(let i=0;i<n;i++)s+=C(x+(i*97)%w,y+(i*61)%h,(i%3)*.8+1,'#fff',`opacity="${.5+(i%5)/10}"`);return s},
  stars(n,y2){let s='';for(let i=0;i<n;i++){const x=(i*397)%1600,y=(i*233)%(y2||500);s+=C(x,y,(i%3)+1,'#fff',`opacity="${.4+(i%5)/10}"`)}return s},
  light(x,y,r){return C(x,y,r||260,'url(#glowY)','pointer-events="none"')},
  lamp(x,y){return R(x-2,0,4,y-30,'#333')+P(`M${x-50} ${y} L${x-22} ${y-36} L${x+22} ${y-36} L${x+50} ${y} Z`,'#3d3d3d')+C(x,y+4,14,'#ffe9a0')+ART.light(x,y+60,240)},
  window(x,y,w,h,inner){const id='cw'+x+'_'+y;return R(x-14,y-14,w+28,h+28,'#5b4330','rx="6"')+`<clipPath id="${id}"><rect x="${x}" y="${y}" width="${w}" height="${h}"/></clipPath>`+G(inner||R(x,y,w,h,'#7ec8ff'),`clip-path="url(#${id})"`)+R(x+w/2-4,y,8,h,'#5b4330')+R(x,y+h/2-4,w,8,'#5b4330')+R(x-24,y+h+12,w+48,16,'#6d5038','rx="4"')},
  frame(x,y,w,h,inner,c){return R(x-12,y-12,w+24,h+24,c||'#c9a24a','rx="4" filter="url(#sh)"')+R(x-4,y-4,w+8,h+8,'#7a5a1e')+G(inner||R(x,y,w,h,'#eee'))},
  shelf(x,y,w,items){let s=R(x,y,w,16,'url(#wood)','rx="3" filter="url(#sh)"')+R(x+10,y+16,10,22,'#4a2e18')+R(x+w-20,y+16,10,22,'#4a2e18');(items||[]).forEach(([dx,e,sz])=>s+=EM(x+dx,y-(sz||46)/2,e,sz||46));return s},
  books(x,y,n,cols){let s='',cx=x;for(let i=0;i<n;i++){const w=22+(i*7)%14,h=90+(i*13)%40;s+=R(cx,y-h,w,h,cols[i%cols.length],'rx="2" stroke="#0004" stroke-width="2"')+R(cx+4,y-h+12,w-8,4,'#fff6');cx+=w+3}return s},
  bookcase(x,y,w,h,cols){let s=R(x,y,w,h,'url(#wood)','rx="6" filter="url(#sh)"');const n=4;for(let i=0;i<n;i++){const yy=y+20+i*(h-30)/n;s+=R(x+12,yy,w-24,(h-30)/n-8,'#2b1a0c');s+=ART.books(x+18,yy+(h-30)/n-8,Math.floor((w-36)/30),cols)}return s},
  desk(x,y,w,c){c=c||'url(#wood)';return R(x,y,w,26,c,'rx="6" filter="url(#sh)"')+R(x+16,y+26,20,120,'#4a2e18')+R(x+w-36,y+26,20,120,'#4a2e18')+R(x+w-210,y+26,170,70,'#6b4426','rx="4"')+R(x+w-140,y+56,30,8,'#d4af37','rx="3"')},
  table(x,y,w,c){return E(x+w/2,y,w/2,30,c||'#7a5230','filter="url(#sh)"')+R(x+w/2-12,y,24,140,'#4a2e18')+E(x+w/2,y+140,70,14,'#3a2410')},
  rug(x,y,w,h,c){return E(x,y,w,h,c,'opacity=".85"')+E(x,y,w-24,h-12,'none',`stroke="#fff5" stroke-width="5" stroke-dasharray="14 10"`)},
  chest(x,y,c){return R(x,y,170,100,c||'#7a4a22','rx="10" filter="url(#sh)"')+P(`M${x} ${y+10} Q${x+85} ${y-60} ${x+170} ${y+10} Z`,c||'#8a5628')+R(x,y+20,170,10,'#d4af37')+R(x+75,y+30,20,30,'#d4af37','rx="4"')+C(x+85,y+48,5,'#333')},
  safe(x,y,w,h){return R(x,y,w,h,'url(#metal)','rx="12" filter="url(#sh)"')+R(x+16,y+16,w-32,h-32,'none','stroke="#0005" stroke-width="4" rx="8"')+C(x+w/2,y+h/2,Math.min(w,h)/5,'#2d3238','stroke="#9aa3ad" stroke-width="6"')+R(x+w/2-3,y+h/2-Math.min(w,h)/5,6,Math.min(w,h)/5,'#ddd')},

}

function renderEnd(app){

function fmt(ms){const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}

window.__auto=async function(){const out=[];const sl=ms=>new Promise(r=>setTimeout(r,ms));
  for(let guard=0;guard<400&&S.room<rooms().length;guard++){const r=rooms()[S.room];let moved=false;
    for(const o of r.objects){if(!avail(o)||solved(o)&&!o.door)continue;if(o.need&&!has(o.need)&&!S.used['u_'+o.id])continue;if(o.door&&!o.lock&&!(o.needs||[]).every(flag))continue;
      const room=S.room;if(o.need&&!S.used['u_'+o.id])SEL=o.need;activate(o);await sl(5);
      if(o.lock&&!solved(o)){const k=val(o.lock);const v=Array.isArray(k.ans)?k.ans:k.ans;
        if(k.kind==='dial'){$('mbody')._set(v);$('lkOk').click()}else if(k.kind==='text'){$('li').value=v;$('lf').requestSubmit()}
        else if(k.kind==='choice'){[...document.querySelectorAll('#mbody .opt')].find(b=>b.dataset.v===k.ans).click()}
        else{const arr=Array.isArray(v)?v:String(v).split('');for(const x of arr)[...document.querySelectorAll('#mbody [data-v]')].find(b=>b.dataset.v===x).click();$('lkOk')&&$('lkOk').click()}
        await sl(30)}
      if(!$('ov').classList.contains('hide')&&S.room===room)closeModal();out.push(o.id);moved=true;break}
    if(!moved){return{stuck:S.room,inv:S.inv,flags:S.flags,done:out}}}
  return{ok:S.room>=rooms().length,done:out}};
